name: Daily health report

on:
  schedule:
    # 09:47 Asia/Kolkata (UTC+05:30). GitHub schedules can run late.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-health-main
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true
      - name: Run checks and write the report
        id: checks
        shell: bash
        run: |
          set -uo pipefail
          report_date="$(TZ=Asia/Kolkata date +%F)"
          report="docs/maintenance/${report_date}.md"
          if [[ -e "$report" ]]; then
            echo "A report already exists for ${report_date}."
            echo "existing=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          flutter pub get > "$RUNNER_TEMP/pub-get.log" 2>&1
          pub_status=$?
          if [[ "$pub_status" -eq 0 ]]; then
            flutter analyze > "$RUNNER_TEMP/analyze.log" 2>&1
            analyze_status=$?
            flutter test test > "$RUNNER_TEMP/test.log" 2>&1
            test_status=$?
          else
            analyze_status=125
            test_status=125
          fi

          set -e
          mkdir -p docs/maintenance
          {
            echo "# CareConnect health report — ${report_date}"
            echo
            echo 'Generated by GitHub Actions. This is automated maintenance evidence, not a claim of manual coding or an application code change.'
            echo
            echo "- Source revision: \`${GITHUB_SHA}\`"
            echo "- Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Flutter dependency resolution: exit ${pub_status}"
            echo "- Flutter analysis: exit ${analyze_status}"
            echo "- Flutter unit and widget tests: exit ${test_status}"
            echo
            echo 'Exit 125 means a check was skipped because dependency resolution failed.'
          } > "$report"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$report"
          git commit -m "chore: record automated health report for ${report_date}"
          git push origin HEAD:main
          echo "existing=false" >> "$GITHUB_OUTPUT"
          if [[ "$pub_status" -ne 0 || "$analyze_status" -ne 0 || "$test_status" -ne 0 ]]; then
            echo 'One or more checks failed; see the report and workflow logs.' >&2
            exit 1
          fi
